<button id="fullscreenToggle" type="button">⛶ 전체화면</button>
<script>
(function(){
  const btn=document.getElementById('fullscreenToggle');
  let active=false;

  async function toggleFullscreen(){
    active=!active;
    document.body.classList.toggle('catalog-fullscreen',active);
    btn.textContent=active?'⛶ 원래 화면':'⛶ 전체화면';

    try{
      if(active && document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
      }else if(!active && document.fullscreenElement){
        await document.exitFullscreen();
      }
    }catch(e){
      console.log('브라우저 전체화면 제한:',e.message);
    }

    if(typeof fit==='function')fit();
  }

  btn.addEventListener('click',toggleFullscreen);

  document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement && active){
      active=false;
      document.body.classList.remove('catalog-fullscreen');
      btn.textContent='⛶ 전체화면';
      if(typeof fit==='function')fit();
    }
  });
})();
</script>
